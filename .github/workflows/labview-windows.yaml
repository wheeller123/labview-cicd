name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VIPM installer
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = "$env:RUNNER_TEMP\vipm-setup.exe"
          Invoke-WebRequest -Uri "https://packages.jki.net/vipm/preview/vipm-setup-latest-preview.exe" -OutFile $exe
          $fi = Get-Item $exe
          Write-Host "Downloaded $($fi.Length) bytes"
          $ver = (Get-Item $exe).VersionInfo
          Write-Host "ProductName : $($ver.ProductName)"
          Write-Host "FileVersion : $($ver.FileVersion)"
          Write-Host "ProductVer  : $($ver.ProductVersion)"
          Write-Host "OriginalName: $($ver.OriginalFilename)"

      - name: Inspect installer bootstrapper
        shell: pwsh
        run: |
          # InstallShield/MSI bundles support /? but suppress output; instead
          # extract the payload to inspect what setup engine is in use.
          $exe = "$env:RUNNER_TEMP\vipm-setup.exe"
          $extract = "$env:RUNNER_TEMP\vipm-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Write-Host "Attempting InstallShield extraction (/extract_all)..."
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "/extract_all:`"$extract`""
          Write-Host "extract_all exit code: $($p.ExitCode)"
          Get-ChildItem -Path $extract -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Install VIPM (silent)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vipm-setup.exe"
          $log = "$env:RUNNER_TEMP\vipm-install.log"
          # InstallShield silent: /s for setup.exe, pass MSI options + verbose
          # log through /v to the embedded msiexec.
          $args = "/s /v`"/qn /norestart /l*v `"`"$log`"`"`""
          Write-Host "Running: $exe $args"
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList $args
          Write-Host "Installer exit code: $($p.ExitCode)"

          # Surface any MSI logs the bootstrapper may have written.
          foreach ($candidate in @($log) + (Get-ChildItem "$env:TEMP\*.log","$env:RUNNER_TEMP\*.log" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)) {
            if ($candidate -and (Test-Path $candidate)) {
              Write-Host "===== LOG: $candidate (last 100 lines) ====="
              Get-Content $candidate -ErrorAction SilentlyContinue | Select-Object -Last 100
            }
          }
          if ($p.ExitCode -ne 0) { throw "VIPM installer failed with exit code $($p.ExitCode)" }

      - name: Locate VIPM CLI and add to PATH
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramFiles\JKI",
            "${env:ProgramFiles(x86)}\JKI",
            "$env:ProgramFiles\National Instruments",
            "${env:ProgramFiles(x86)}\National Instruments"
          ) | Where-Object { $_ -and (Test-Path $_) }

          Write-Host "Searching for vipm.exe under: $($roots -join ', ')"
          $hits = @()
          foreach ($r in $roots) {
            $hits += Get-ChildItem -Path $r -Filter "vipm*.exe" -Recurse -ErrorAction SilentlyContinue
          }

          if (-not $hits) {
            Write-Host "::warning::No vipm*.exe found. Dumping JKI/NI install trees for diagnosis:"
            foreach ($r in $roots) {
              Write-Host "=== $r ==="
              Get-ChildItem -Path $r -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            }
            throw "VIPM CLI (vipm.exe) was not found after installation."
          }

          $hits | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          $dir = ($hits | Select-Object -First 1).Directory.FullName
          Write-Host "Adding to PATH: $dir"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: VIPM version
        shell: pwsh
        run: vipm version

      - name: VIPM refresh
        shell: pwsh
        run: vipm refresh
