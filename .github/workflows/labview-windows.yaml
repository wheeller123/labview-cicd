name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NI Package Manager
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = "$env:RUNNER_TEMP\NIPackageManager.exe"
          Invoke-WebRequest -Uri "https://download.ni.com/support/nipkg/products/ni-package-manager/installers/NIPackageManager25.8.0.exe" -OutFile $exe
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "--passive","--accept-eulas","--prevent-reboot"
          # NI installers: 0 = success, 3010 / -125071 = success but reboot needed.
          if ($p.ExitCode -notin 0,3010,-125071) { throw "NIPM install failed: $($p.ExitCode)" }

      - name: Install NI LabVIEW 2020 SP1 Runtime (VIPM prerequisite)
        shell: pwsh
        run: |
          $nipkg = "C:\Program Files\National Instruments\NI Package Manager\nipkg.exe"
          & $nipkg feed-add --name=lvrte2020 "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2020-runtime-engine/20.1/released"
          & $nipkg feed-add --name=lvrte2020-critical "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2020-runtime-engine/20.1/released-critical"
          & $nipkg update
          & $nipkg install --accept-eulas --assume-yes ni-labview-2020-runtime-engine
          # -125071 = reboot needed; packages are installed, a hosted runner cannot reboot.
          if ($LASTEXITCODE -notin 0,-125071) { throw "nipkg install failed: $LASTEXITCODE" }
          exit 0

      - name: Install LabVIEW 2023 (dragon target / build host)
        shell: pwsh
        run: |
          $nipkg = "C:\Program Files\National Instruments\NI Package Manager\nipkg.exe"
          & $nipkg feed-add --name=lv2023 "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2023/23.3/released"
          & $nipkg feed-add --name=lv2023-critical "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2023/23.3/released-critical"
          & $nipkg update
          # deployable-license licenses LabVIEW non-interactively; without it
          # LabVIEW parks on its activation dialog and VI Server never starts.
          & $nipkg install --accept-eulas --assume-yes ni-labview-2023-core-en ni-labview-2023-deployable-license
          # -125071 = reboot needed; packages are installed, a hosted runner cannot reboot.
          if ($LASTEXITCODE -notin 0,-125071) { throw "nipkg install failed: $LASTEXITCODE" }
          exit 0

      - name: Install VIPM
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = "$env:RUNNER_TEMP\vipm-setup.exe"
          Invoke-WebRequest -Uri "https://packages.jki.net/vipm/preview/vipm-setup-latest-preview.exe" -OutFile $exe
          # /exenoui /qn is the only fully non-interactive invocation; other
          # flag combinations hang the runner.
          $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "/exenoui","/qn"
          if ($p.ExitCode -ne 0) { throw "VIPM install failed: $($p.ExitCode)" }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\JKI\VI Package Manager\support"

      - name: Seed VIPM Settings.ini
        shell: pwsh
        run: |
          # Without a Settings.ini, "vipm refresh" hangs on first-launch setup.
          # Raise the LabVIEW connection timeout while copying: 120s is too
          # tight for a cold first launch on a fresh runner.
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\JKI\VIPM" | Out-Null
          (Get-Content "$env:GITHUB_WORKSPACE\Docs\Settings.ini") -replace 'Connection Timeout="120"','Connection Timeout="600"' |
            Set-Content "C:\ProgramData\JKI\VIPM\Settings.ini"

      - name: VIPM version
        shell: pwsh
        run: vipm version

      - name: VIPM refresh
        shell: pwsh
        run: vipm refresh

      - name: Configure and warm up LabVIEW VI Server
        shell: pwsh
        run: |
          # VIPM drives LabVIEW over VI Server (TCP 3363). Enable it in
          # LabVIEW.ini using LabVIEW's own quoting (strings are quoted),
          # then launch LabVIEW and verify the port actually opens before
          # handing over to vipm install.
          $lvdir = "C:\Program Files\National Instruments\LabVIEW 2023"
          $ini = "$lvdir\LabVIEW.ini"

          function Write-LvIni([string[]]$tokens) {
            Set-Content -Path $ini -Value (@("[LabVIEW]") + $tokens)
            Write-Host "--- LabVIEW.ini ---"
            Get-Content $ini | Write-Host
          }
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public class WinEnum {
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr p, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Auto)] static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, StringBuilder l);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] static extern void mouse_event(uint f, uint dx, uint dy, uint d, IntPtr i);
            public struct RECT { public int L, T, R, B; }
            delegate bool EnumProc(IntPtr h, IntPtr lp);
            // Click at a position given as a fraction of the window size of the
            // first top-level window of pid whose title matches exactly.
            public static string ClickAt(uint targetPid, string title, double fx, double fy) {
              string result = "window not found";
              EnumWindows((h, lp) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid != targetPid) return true;
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                if (sb.ToString().TrimEnd() != title) return true;
                RECT r; GetWindowRect(h, out r);
                if (r.R - r.L < 300) return true; // skip helper windows
                int x = r.L + (int)((r.R - r.L) * fx);
                int y = r.T + (int)((r.B - r.T) * fy);
                SetForegroundWindow(h);
                System.Threading.Thread.Sleep(500);
                SetCursorPos(x, y);
                System.Threading.Thread.Sleep(200);
                mouse_event(0x0002, 0, 0, 0, IntPtr.Zero); // LBUTTONDOWN
                mouse_event(0x0004, 0, 0, 0, IntPtr.Zero); // LBUTTONUP
                result = "clicked (" + x + "," + y + ") in rect " + r.L + "," + r.T + "," + r.R + "," + r.B;
                return false;
              }, IntPtr.Zero);
              return result;
            }
            public static List<string> Dump(uint targetPid) {
              var r = new List<string>();
              EnumWindows((h, lp) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid != targetPid) return true;
                var sb = new StringBuilder(256); GetWindowText(h, sb, 256);
                r.Add(pid + " TOP: '" + sb + "'");
                EnumChildWindows(h, (c, lp2) => {
                  var cls = new StringBuilder(128); GetClassName(c, cls, 128);
                  var txt = new StringBuilder(512); SendMessage(c, 0x000D, (IntPtr)512, txt);
                  if (txt.Length > 0) r.Add("   [" + cls + "] " + txt.ToString().Replace("\r"," ").Replace("\n"," "));
                  return true;
                }, IntPtr.Zero);
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          '@
          function Wait-ViServer([int]$seconds) {
            $until = (Get-Date).AddSeconds($seconds)
            $n = 0
            while ((Get-Date) -lt $until) {
              Start-Sleep -Seconds 10
              $ok = (Test-NetConnection localhost -Port 3363 -WarningAction SilentlyContinue).TcpTestSucceeded
              Write-Host "$(Get-Date -Format HH:mm:ss) port 3363 open: $ok"
              if ($ok) { return $true }
              $n++
              if ($n % 6 -eq 0) {
                Get-Process -Name LabVIEW -ErrorAction SilentlyContinue | ForEach-Object {
                  Write-Host "--- LabVIEW pid $($_.Id) windows + child texts ---"
                  [WinEnum]::Dump([uint32]$_.Id) | ForEach-Object { Write-Host $_ }
                }
              }
            }
            return $false
          }
          function Save-Screenshot {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$env:RUNNER_TEMP\desktop.png")
            Write-Host "Saved screenshot."
          }

          Write-LvIni @(
            'server.tcp.enabled=True',
            'server.tcp.port=3363',
            'server.tcp.access="+*"',
            'server.vi.access="+*"',
            'server.app.propertiesEnabled=True',
            'server.vi.propertiesEnabled=True',
            'server.vi.callsEnabled=True',
            'ShowWelcomeOnLaunch=False',
            'neverShowAddonActivationDialog=True'
          )
          Start-Process "$lvdir\LabVIEW.exe"
          # Give LabVIEW time to show the activation window, then start the
          # 7-day trial (fresh on every run since hosted runners are ephemeral).
          # "Begin 7-Day Trial" sits at ~83% width / ~94% height of the dialog.
          Start-Sleep -Seconds 60
          $lvPid = (Get-Process -Name LabVIEW -ErrorAction SilentlyContinue | Select-Object -First 1).Id
          if ($lvPid) {
            $res = [WinEnum]::ClickAt([uint32]$lvPid, "LabVIEW", 0.83, 0.94)
            Write-Host "Trial click: $res"
            Start-Sleep -Seconds 10
            Save-Screenshot
          }
          if (Wait-ViServer 420) { Write-Host "VI Server is up."; exit 0 }
          Save-Screenshot
          throw "VI Server port 3363 never opened; LabVIEW cannot be driven by VIPM."

      - name: Install dragon dependencies
        shell: pwsh
        env:
          VIPM_TIMEOUT: "600"
        run: |
          # Run the install in the background and poll window titles so the
          # log reveals any dialog LabVIEW is blocking on.
          $job = Start-Job -ScriptBlock {
            vipm install "$using:env:GITHUB_WORKSPACE\Source\Simple_Project.dragon" 2>&1
            $LASTEXITCODE
          }
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public class WinEnum {
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            delegate bool EnumProc(IntPtr h, IntPtr lp);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr p, EnumProc cb, IntPtr lp);
            [DllImport("user32.dll")] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Auto)] static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, StringBuilder l);
            public static List<string> All() {
              var r = new List<string>();
              EnumWindows((h, lp) => {
                var sb = new StringBuilder(256);
                GetWindowText(h, sb, 256);
                if (sb.Length > 0) { uint pid; GetWindowThreadProcessId(h, out pid); r.Add(pid + ": " + sb); }
                return true;
              }, IntPtr.Zero);
              return r;
            }
            public static List<string> Children(string title) {
              var r = new List<string>();
              EnumWindows((h, lp) => {
                var sb = new StringBuilder(256);
                GetWindowText(h, sb, 256);
                if (sb.ToString().TrimEnd() == title) {
                  EnumChildWindows(h, (c, lp2) => {
                    var cls = new StringBuilder(128); GetClassName(c, cls, 128);
                    var txt = new StringBuilder(512); SendMessage(c, 0x000D, (IntPtr)512, txt);
                    r.Add("  [" + cls + "] " + txt.ToString().Replace("\r"," ").Replace("\n"," "));
                    return true;
                  }, IntPtr.Zero);
                }
                return true;
              }, IntPtr.Zero);
              return r;
            }
          }
          '@
          $deadline = (Get-Date).AddMinutes(12)
          while ((Get-Date) -lt $deadline -and $job.State -eq 'Running') {
            Start-Sleep -Seconds 45
            Write-Host "--- $(Get-Date -Format HH:mm:ss) all top-level windows (pid: title) ---"
            [WinEnum]::All() | ForEach-Object { Write-Host $_ }
            Write-Host "--- children of 'LabVIEW' window ---"
            [WinEnum]::Children("LabVIEW") | ForEach-Object { Write-Host $_ }
            $port = Test-NetConnection -ComputerName localhost -Port 3363 -WarningAction SilentlyContinue
            Write-Host "VI Server port 3363 open: $($port.TcpTestSucceeded)"
            Get-Process -Name "LabVIEW","vipm" -ErrorAction SilentlyContinue |
              Select-Object ProcessName, Id, CPU | Format-Table -AutoSize | Out-String | Write-Host
          }
          # Screenshot of the desktop for visual confirmation of any dialog.
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\desktop.png")
          Write-Host "Saved screenshot to RUNNER_TEMP\desktop.png"
          $out = Receive-Job $job -Wait
          $code = $out | Select-Object -Last 1
          $out | Select-Object -SkipLast 1 | Write-Host
          Write-Host "vipm install exit code: $code"
          if ($code -ne 0) { throw "vipm install failed/timed out (code $code)" }

      - name: Upload desktop screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: ${{ runner.temp }}\desktop.png
          if-no-files-found: ignore
