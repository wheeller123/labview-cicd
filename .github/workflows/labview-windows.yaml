name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        working-directory: Docker
        run: docker build -t vipm-labview-windows-test:latest .

      - name: Verify VIPM installation
        run: |
          echo "Testing VIPM installation..."
          docker run --rm vipm-labview-windows-test:latest powershell -Command "vipm help"
          echo "VIPM help command executed successfully"
          
      - name: Verify VIPM version
        run: |
          echo "Checking VIPM version..."
          docker run --rm vipm-labview-windows-test:latest powershell -Command "vipm version"
          echo "VIPM version check completed"

      - name: Activate VIPM (with Debugging and Daemon Wake-up)
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: >
          docker run --rm
          -e VIPM_SERIAL_NUMBER
          -e VIPM_FULL_NAME
          -e VIPM_EMAIL
          vipm-labview-windows-test:latest
          powershell -Command "Write-Host 'Checking variables...'; Write-Host 'Email: ' $env:VIPM_EMAIL; Write-Host 'Serial provided: ' $([bool]$env:VIPM_SERIAL_NUMBER); Write-Host 'Testing connection to JKI...'; try { (Invoke-WebRequest -Uri 'https://www.vipm.io' -UseBasicParsing).StatusCode } catch { Write-Host 'Connection failed' }; Write-Host 'Waking up Daemon...'; vipm api port; Start-Sleep -Seconds 15; Write-Host 'Activating...'; vipm activate --serial-number $env:VIPM_SERIAL_NUMBER --name $env:VIPM_FULL_NAME --email $env:VIPM_EMAIL"

      - name: "Install VIPM Dependencies"
        run: |
          echo "Installing VIPM dependencies..."
          docker run --rm -v "${env:GITHUB_WORKSPACE}:C:\workspace" vipm-labview-windows-test:latest powershell -Command "vipm install C:\workspace\Source\Simple_Project.dragon"
          echo "VIPM dependencies installation completed"

      - name: "Compile LabVIEW Project Build Specs"
        run: |
          echo "Compiling LabVIEW project..."
          docker run --rm -v "${env:GITHUB_WORKSPACE}:C:\workspace" vipm-labview-windows-test:latest powershell -Command "LabVIEWCLI compile --project C:\workspace\Source\Simple_Project.lvproj --build-spec Simple_Build_Spec"
          echo "LabVIEW project compilation completed"