name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Docker
        run: Start-Service docker

      - name: Pull LabVIEW container image
        run: docker pull nationalinstruments/labview:latest-windows

      - name: Write Dockerfile
        run: |
          @'
          FROM nationalinstruments/labview:latest-windows
          SHELL ["powershell", "-Command", "$ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue';"]
          RUN Invoke-WebRequest -Uri 'https://packages.jki.net/vipm/preview/vipm-setup-latest-preview.exe' -OutFile 'C:\\vipm-setup.exe' ; `
              Start-Process -Wait -FilePath 'C:\\vipm-setup.exe' -ArgumentList '/quiet', '/norestart' ; `
              Remove-Item 'C:\\vipm-setup.exe' -Force
          RUN [Environment]::SetEnvironmentVariable('PATH', $env:PATH + ';C:\Program Files\JKI\VIPM', 'Machine')
          SHELL ["cmd", "/S", "/C"]
          CMD ["powershell"]
          '@ | Set-Content Dockerfile

      - name: Build image with VIPM
        run: docker build -t vipm-labview-windows .

      - name: Activate VIPM
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: >
          docker run --rm
          -e VIPM_SERIAL_NUMBER
          -e VIPM_FULL_NAME
          -e VIPM_EMAIL
          vipm-labview-windows
          powershell -Command "vipm activate --serial-number $env:VIPM_SERIAL_NUMBER --name $env:VIPM_FULL_NAME --email $env:VIPM_EMAIL"

      - name: Check VIPM version
        run: docker run --rm vipm-labview-windows powershell -Command "vipm --version"
