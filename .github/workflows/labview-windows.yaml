name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install VIPM (JKI preview)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://packages.jki.net/vipm/preview/vipm-setup-latest-preview.exe" -OutFile "$env:TEMP\vipm-setup.exe"
          Write-Host "Running VIPM installer..."
          $log = "$env:TEMP\vipm-install.log"
          $p = Start-Process -Wait -PassThru -FilePath "$env:TEMP\vipm-setup.exe" -ArgumentList "/exenoui /qn /log `"$log`""
          Write-Host "Installer exit code: $($p.ExitCode)"
          if (Test-Path $log) {
            Write-Host "===== VIPM install log ====="
            Get-Content $log | Select-Object -Last 120
            Write-Host "===== end install log ====="
          } else {
            Write-Host "No install log produced at $log"
          }
          Remove-Item "$env:TEMP\vipm-setup.exe" -Force
          if ($p.ExitCode -ne 0) { throw "VIPM installer failed with exit code $($p.ExitCode)" }

      - name: Locate VIPM CLI and add to PATH
        shell: pwsh
        run: |
          $roots = @(
            "$env:ProgramFiles\JKI",
            "${env:ProgramFiles(x86)}\JKI",
            "$env:ProgramFiles\National Instruments",
            "${env:ProgramFiles(x86)}\National Instruments"
          ) | Where-Object { $_ -and (Test-Path $_) }

          Write-Host "Searching for vipm.exe under: $($roots -join ', ')"
          $hits = @()
          foreach ($r in $roots) {
            $hits += Get-ChildItem -Path $r -Filter "vipm*.exe" -Recurse -ErrorAction SilentlyContinue
          }

          if (-not $hits) {
            Write-Host "::warning::No vipm*.exe found. Dumping JKI/NI install trees for diagnosis:"
            foreach ($r in $roots) {
              Write-Host "=== $r ==="
              Get-ChildItem -Path $r -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            }
            throw "VIPM CLI (vipm.exe) was not found after installation."
          }

          $hits | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          $dir = ($hits | Select-Object -First 1).Directory.FullName
          Write-Host "Adding to PATH: $dir"
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: VIPM version
        shell: pwsh
        run: vipm version

      - name: VIPM refresh
        shell: pwsh
        run: vipm refresh
