name: NI Docker Build

# Template pipeline: build a LabVIEW project inside NI's official LabVIEW
# Windows container, with dependencies installed by VIPM (latest preview)
# from the project's .dragon file. Nothing package-specific is hardcoded —
# point DRAGON/PROJECT/BUILD_SPEC at another project to reuse.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NI_IMAGE: nationalinstruments/labview:latest-windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker engine (Windows containers)
        shell: pwsh
        run: |
          # Move the docker data-root to the runner's large D: drive (the NI
          # image does not fit on C:), then start the daemon — windows-latest
          # runners intermittently boot with it down (runner-images#13729).
          try { Stop-Service docker -ErrorAction Stop } catch {}
          $cfgDir = 'C:\ProgramData\docker\config'
          $cfg = if (Test-Path "$cfgDir\daemon.json") { Get-Content "$cfgDir\daemon.json" -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          $cfg | Add-Member -NotePropertyName 'data-root' -NotePropertyValue 'D:\docker' -Force
          New-Item -ItemType Directory -Force -Path $cfgDir, 'D:\docker' | Out-Null
          ($cfg | ConvertTo-Json) | Set-Content "$cfgDir\daemon.json"
          try { Start-Service docker -ErrorAction Stop } catch {}
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 5
            docker version 2>$null | Out-Null
            $ok = ($LASTEXITCODE -eq 0)
          } while (-not $ok -and (Get-Date) -lt $deadline)
          if (-not $ok) { throw 'Docker daemon did not become available' }

      - name: Pull NI LabVIEW image
        shell: pwsh
        run: |
          docker pull $env:NI_IMAGE
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed: $LASTEXITCODE" }

      - name: Start container
        shell: pwsh
        run: |
          # One long-lived container so VIPM install + keep-alive LabVIEW +
          # build all share the same state.
          docker run -d --name lv -v "${{ github.workspace }}:C:\workspace" $env:NI_IMAGE ping -t localhost
          if ($LASTEXITCODE -ne 0) { throw "docker run failed: $LASTEXITCODE" }
          docker exec lv cmd /c echo container-ready
          if ($LASTEXITCODE -ne 0) { throw "container not responding: $LASTEXITCODE" }

      - name: Install VIPM (latest preview) + refresh
        timeout-minutes: 25
        shell: pwsh
        run: |
          docker exec lv powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\.github\scripts\container-setup-vipm.ps1
          if ($LASTEXITCODE -ne 0) { throw "VIPM setup failed: $LASTEXITCODE" }

      - name: Install dragon dependencies (vipm install)
        timeout-minutes: 50
        shell: pwsh
        run: |
          docker exec lv powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\.github\scripts\container-install-deps.ps1
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed: $LASTEXITCODE" }

      - name: Build test_build for every LabVIEW version (ExecuteBuildSpec)
        timeout-minutes: 40
        shell: pwsh
        run: |
          docker exec lv powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\.github\scripts\container-build.ps1
          if ($LASTEXITCODE -ne 0) { throw "container build failed: $LASTEXITCODE" }

      - name: Verify per-version build output on host
        shell: pwsh
        run: |
          # container-build.ps1 writes one Build-<year>\ dir per LabVIEW version.
          $dirs = Get-ChildItem $env:GITHUB_WORKSPACE -Directory -Filter 'Build-*'
          if (-not $dirs) { throw "no Build-<year> output dirs found on host" }
          foreach ($d in $dirs) {
            $exe = Join-Path $d.FullName 'Application.exe'
            if (-not (Test-Path $exe)) { throw "missing: $exe" }
            if ((Get-Item $exe).Length -le 0) { throw "$exe is empty" }
            Write-Host "Build output present: $exe ($((Get-Item $exe).Length) bytes)"
          }

      - name: Upload per-version build artifacts
        uses: actions/upload-artifact@v4
        with:
          # One zip with a Build-<year>\ folder per LabVIEW version; download the
          # folder matching your LabVIEW version (matters for lvlibs / packed
          # libs, e.g. VeriStand custom devices for RT targets).
          name: test_build-all-versions
          path: Build-*/**
          if-no-files-found: error

      - name: Tear down container
        if: always()
        shell: pwsh
        run: |
          docker rm -f lv 2>&1 | Out-Null
          exit 0
