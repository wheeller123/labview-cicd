name: VIPM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-packages:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install VIPM
        run: |
          $url = "https://packages.jki.net/vipm/preview/vipm_latest_preview_x64.exe"
          $installer = "$env:TEMP\vipm_installer.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          Remove-Item $installer

      - name: Activate VIPM
        run: |
          vipm activate `
            --serial-number "${{ secrets.VIPM_SERIAL_NUMBER }}" `
            --name "${{ secrets.VIPM_FULL_NAME }}" `
            --email "${{ secrets.VIPM_EMAIL }}"

      - name: Refresh package list
        run: vipm package-list-refresh

      - name: Install project dependencies
        run: vipm install project.vipc

      - name: List installed packages
        run: vipm list --installed
