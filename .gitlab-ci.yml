# GitLab CI/CD equivalent of .github/workflows/labview-windows.yaml.
#
# Installs the full VIPM package stack on the `adaptive-win22` runner:
#   NI Package Manager -> NI LabVIEW 2020 SP1 Runtime -> VIPM -> seed
#   Settings.ini -> vipm version -> vipm refresh.
#
# All steps run in PowerShell (the GitLab Windows shell default), mirroring
# the `shell: pwsh` steps in the GitHub workflow. GitHub env vars are mapped:
#   $env:RUNNER_TEMP      -> $env:TEMP
#   $env:GITHUB_WORKSPACE -> $env:CI_PROJECT_DIR
#   GITHUB_PATH append    -> prepend to $env:PATH for the rest of the job

stages:
  - install

install-packages:
  stage: install
  tags:
    - adaptive-win22
  timeout: 45m
  script:
    # Install NI Package Manager
    - |
      Write-Host "[1/6] Installing NI Package Manager (VIPM installer prerequisite)..."
      $ProgressPreference = 'SilentlyContinue'
      $exe = "$env:TEMP\NIPackageManager.exe"
      Write-Host "  Downloading NI Package Manager installer..."
      Invoke-WebRequest -Uri "https://download.ni.com/support/nipkg/products/ni-package-manager/installers/NIPackageManager25.8.0.exe" -OutFile $exe
      Write-Host "  Running NIPM installer silently (--passive --accept-eulas --prevent-reboot)..."
      $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "--passive","--accept-eulas","--prevent-reboot"
      # NI installers: 0 = success, 3010 / -125071 = success but reboot needed.
      if ($p.ExitCode -notin 0,3010,-125071) { throw "NIPM install failed: $($p.ExitCode)" }
      Write-Host "  NI Package Manager installed (exit $($p.ExitCode))."
    # Install NI LabVIEW 2020 SP1 Runtime (VIPM prerequisite)
    - |
      Write-Host "[2/6] Installing NI LabVIEW 2020 SP1 Runtime (VIPM's missing prerequisite)..."
      $nipkg = "C:\Program Files\National Instruments\NI Package Manager\nipkg.exe"
      Write-Host "  Adding LabVIEW 2020 runtime feeds (released + released-critical)..."
      # feed-add can fail if the feed already exists on a persistent runner; that
      # is fine, so don't let it abort the step.
      & $nipkg feed-add --name=lvrte2020 "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2020-runtime-engine/20.1/released"; cmd /c "exit 0"
      & $nipkg feed-add --name=lvrte2020-critical "https://download.ni.com/support/nipkg/products/ni-l/ni-labview-2020-runtime-engine/20.1/released-critical"; cmd /c "exit 0"
      Write-Host "  Updating nipkg feed metadata..."
      & $nipkg update
      Write-Host "  Installing ni-labview-2020-runtime-engine..."
      & $nipkg install --accept-eulas --assume-yes ni-labview-2020-runtime-engine
      # -125071 = reboot needed; packages are installed, runner cannot reboot.
      if ($LASTEXITCODE -notin 0,-125071) { throw "nipkg install failed: $LASTEXITCODE" }
      Write-Host "  LabVIEW 2020 SP1 Runtime installed (nipkg exit $LASTEXITCODE; -125071 = reboot-deferred, OK)."
      # Clear the benign -125071 so GitLab does not re-raise it. Do NOT use
      # `exit 0` here: GitLab concatenates all script lines into one .ps1, so
      # exiting would skip every step below. A trivial native call resets
      # $LASTEXITCODE to 0 without ending the script.
      cmd /c "exit 0"
    # Install VIPM
    - |
      Write-Host "[3/6] Installing VIPM..."
      $ProgressPreference = 'SilentlyContinue'
      $exe = "$env:TEMP\vipm-setup.exe"
      Write-Host "  Downloading VIPM preview installer..."
      Invoke-WebRequest -Uri "https://packages.jki.net/vipm/preview/vipm-setup-latest-preview.exe" -OutFile $exe
      Write-Host "  Running VIPM installer silently (/exenoui /qn)..."
      # /exenoui /qn is the only fully non-interactive invocation; other
      # flag combinations hang the runner.
      $p = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList "/exenoui","/qn"
      if ($p.ExitCode -ne 0) { throw "VIPM install failed: $($p.ExitCode)" }
      $env:PATH = "C:\Program Files\JKI\VI Package Manager\support;$env:PATH"
      Write-Host "  VIPM installed and added to PATH (exit $($p.ExitCode))."
    # Seed VIPM Settings.ini
    - |
      Write-Host "[4/6] Seeding VIPM Settings.ini (prevents 'vipm refresh' first-launch hang)..."
      New-Item -ItemType Directory -Force -Path "C:\ProgramData\JKI\VIPM" | Out-Null
      Copy-Item "$env:CI_PROJECT_DIR\Docs\Settings.ini" "C:\ProgramData\JKI\VIPM\Settings.ini" -Force
      Write-Host "  Settings.ini copied to C:\ProgramData\JKI\VIPM."
    # VIPM version
    - |
      Write-Host "[5/6] Checking VIPM version..."
      & "C:\Program Files\JKI\VI Package Manager\support\vipm.exe" version
    # VIPM refresh
    - |
      Write-Host "[6/6] Refreshing VIPM package list..."
      & "C:\Program Files\JKI\VI Package Manager\support\vipm.exe" refresh
      Write-Host "  VIPM refresh complete."
